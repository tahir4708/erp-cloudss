services:
  aurum:
    build: .
    image: aurum-signals:latest
    container_name: aurum-signals
    ports:
      - "8050:8000"
    environment:
      PORT: "8000"
      # Exness MT5 bridge on Windows host (run exness_bridge.py on the PC)
      EXNESS_BRIDGE_URL: "http://host.docker.internal:8787"
      EXNESS_OFFSET_XAUUSD: "0"
      EXNESS_OFFSET_XAGUSD: "0"
      EXNESS_OFFSET_BTCUSD: "0"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
